<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        #chat {
            display: none;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .message {
            padding: 10px;
            margin-bottom: 8px;
            background: #eee;
            border-radius: 8px;
        }

        .nickname {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box" id="login">

    <h1>🔐 Přihlášení</h1>

    <input
        type="password"
        id="password"
        placeholder="Heslo"
    >

    <button onclick="login()">
        Přihlásit
    </button>

    <p id="loginError"></p>

</div>


<div class="box" id="nicknameBox" style="display:none;">

    <h1>👤 Přezdívka</h1>

    <input
        type="text"
        id="nickname"
        maxlength="30"
        placeholder="Zadej přezdívku"
    >

    <button onclick="enterChat()">
        Vstoupit do chatu
    </button>

</div>


<div class="box" id="chat">

    <h1>💬 Chat</h1>

    <p>
        Přihlášen jako:
        <strong id="currentNickname"></strong>
    </p>

    <div id="messages">
        Načítám zprávy...
    </div>

    <input
        type="text"
        id="messageInput"
        maxlength="500"
        placeholder="Napiš zprávu..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
        Odeslat
    </button>

</div>


<script>

    // ==========================================
    // SEM VLOŽ ÚDAJE ZE SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://jdvyfigrazambxtnqpkq.supabase.co";

    const SUPABASE_KEY = "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // HESLO PRO VSTUP
    // ==========================================

    const HESLO = "1234";


    let mojePrezdivka = "";


    // ==========================================
    // PŘIHLÁŠENÍ
    // ==========================================

    function login() {

        const password =
            document.getElementById("password").value;

        if (password === HESLO) {

            document.getElementById("login").style.display = "none";

            document.getElementById("nicknameBox").style.display = "block";

        } else {

            document.getElementById("loginError").innerText =
                "❌ Špatné heslo!";
        }
    }


    // ==========================================
    // VSTUP DO CHATU
    // ==========================================

    async function enterChat() {

        const nickname =
            document.getElementById("nickname").value.trim();

        if (!nickname) {

            alert("Zadej přezdívku.");

            return;
        }

        mojePrezdivka = nickname;

        document.getElementById("nicknameBox").style.display = "none";

        document.getElementById("chat").style.display = "block";

        document.getElementById("currentNickname").innerText =
            mojePrezdivka;

        await loadMessages();

// Realtime vypnuto pro test
// subscribeToMessages();
    }


    // ==========================================
    // NAČTENÍ ZPRÁV
    // ==========================================

    async function loadMessages() {

        const { data, error } =
            await supabaseClient
                .from("messages")
                .select("*")
                .order("created_at", {
                    ascending: true
                });

        if (error) {

            console.error(error);

            document.getElementById("messages").innerText =
                "Chyba při načítání zpráv.";

            return;
        }

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        data.forEach(addMessage);
    }


    // ==========================================
    // PŘIDÁNÍ ZPRÁVY NA OBRAZOVKU
    // ==========================================

    function addMessage(message) {

        const messages =
            document.getElementById("messages");

        const div =
            document.createElement("div");

        div.className = "message";

        const nickname =
            document.createElement("strong");

        nickname.className = "nickname";

        nickname.textContent =
            message.nickname + ": ";

        const text =
            document.createElement("span");

        text.textContent =
            message.message;

        div.appendChild(nickname);

        div.appendChild(text);

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;
    }


    // ==========================================
    // ODESLÁNÍ ZPRÁVY
    // ==========================================

    async function sendMessage() {

        const input =
            document.getElementById("messageInput");

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        const { error } =
            await supabaseClient
                .from("messages")
                .insert({
                    nickname: mojePrezdivka,
                    message: text
                });

        if (error) {

            console.error(error);

            alert("Zprávu se nepodařilo odeslat.");

            return;
        }

        input.value = "";
    }


    // ==========================================
    // ŽIVÉ ZPRÁVY
    // ==========================================

    function subscribeToMessages() {

        supabaseClient
            .channel("messages-channel")

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },

                payload => {

                    addMessage(payload.new);

                }
            )

            .subscribe();
    }

</script>

</body>
</html>
