<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj chat - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* PŘIDEJ TYTO STYLY K TVÝM EXISTUJÍCÍM */
        .link-text { color: #0066cc; text-decoration: underline; }
        .reaction-bar { display: flex; gap: 5px; margin-top: 5px; }
        .reaction-btn { background: var(--sub-bg); border: none; border-radius: 10px; padding: 2px 5px; cursor: pointer; font-size: 12px; }
        .reaction-btn:hover { background: var(--box-border); }
    </style>
</head>
<body>
    <!-- Zbytek tvé struktury zůstává stejný -->
    <div id="messages"></div>

<script>
// 1. AUTOMATICKÉ ODKAZY (BOD 2)
function linkify(text) {
    const urlRegex = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
    return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" class="link-text">${url}</a>`);
}

// 2. FUNKCE PRO REAKCE (BOD 4)
async function addReaction(messageId, emoji) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    await supabaseClient.from("reactions").insert({ message_id: messageId, user_id: user.id, emoji });
}

// 3. ÚPRAVA addMessage PRO ZOBRAZENÍ
function addMessage(message, currentUserId) {
    const div = document.createElement("div");
    div.id = `msg-${message.id}`;
    div.className = "message " + (message.user_id === currentUserId ? "mine" : "other");
    
    // Zpracování odkazů
    const content = linkify(message.message);
    
    div.innerHTML = `
        <span class="nickname">${message.nickname}</span>
        <span class="text">${content}</span>
        <div class="reaction-bar" id="reactions-${message.id}">
            <button class="reaction-btn" onclick="addReaction(${message.id}, '👍')">👍</button>
            <button class="reaction-btn" onclick="addReaction(${message.id}, '😂')">😂</button>
        </div>
    `;
    document.getElementById("messages").appendChild(div);
}

// 4. LAZY LOADING / AUTO-SCROLL (BOD 5)
// Stačí v loadMessages() omezit počet zpráv:
async function loadMessages() {
    const { data } = await supabaseClient
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(50); // Načte jen 50 posledních
    
    // Poté je otoč, aby byly správně seřazené pro zobrazení
    data.reverse().forEach(msg => addMessage(msg, currentUser?.id));
}
</script>
</body>
</html>
