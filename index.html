<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .secondary {
            background: #777;
        }

        .logout {
            background: #b00020;
        }

        #registerBox,
        #nicknameBox,
        #chat {
            display: none;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            background: #fafafa;
        }

        /* ============================= */
        /* ZPRÁVY */
        /* ============================= */

        .message {
            width: fit-content;
            max-width: 75%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            clear: both;
            word-wrap: break-word;
        }

        /* Zpráva někoho jiného */
        .message.other {
            margin-right: auto;
            background: #e8e8e8;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        /* Moje zpráva */
        .message.mine {
            margin-left: auto;
            background: #222;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .nickname {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message.mine .nickname {
            color: #ddd;
        }

        .message.other .nickname {
            color: #333;
        }

        .time {
            display: block;
            font-size: 11px;
            margin-top: 6px;
            margin-left: 0;
            color: #777;
        }

        .message.mine .time {
            color: #ccc;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: green;
        }

        .info {
            color: #555;
        }

    </style>
</head>

<body>


<!-- ================================= -->
<!-- PŘIHLÁŠENÍ -->
<!-- ================================= -->

<div class="box" id="loginBox">

    <h1>🔐 Přihlášení</h1>

    <input
        id="loginEmail"
        type="email"
        placeholder="E-mail"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Heslo"
    >

    <button onclick="login()">
        Přihlásit
    </button>

    <button
        class="secondary"
        onclick="showRegister()"
    >
        Vytvořit nový účet
    </button>

    <p id="loginMessage"></p>

</div>


<!-- ================================= -->
<!-- REGISTRACE -->
<!-- ================================= -->

<div class="box" id="registerBox">

    <h1>👤 Registrace</h1>

    <input
        id="registerEmail"
        type="email"
        placeholder="E-mail"
    >

    <input
        id="registerPassword"
        type="password"
        placeholder="Heslo (min. 6 znaků)"
    >

    <input
        id="registerNickname"
        type="text"
        maxlength="30"
        placeholder="Přezdívka"
    >

    <button onclick="register()">
        Vytvořit účet
    </button>

    <button
        class="secondary"
        onclick="showLogin()"
    >
        Zpět na přihlášení
    </button>

    <p id="registerMessage"></p>

</div>


<!-- ================================= -->
<!-- PŘEZDÍVKA -->
<!-- ================================= -->

<div class="box" id="nicknameBox">

    <h1>👤 Přezdívka</h1>

    <p>
        K tomuto účtu zatím nemáš nastavenou přezdívku.
    </p>

    <input
        id="nickname"
        type="text"
        maxlength="30"
        placeholder="Zadej přezdívku"
    >

    <button onclick="saveNickname()">
        Uložit přezdívku
    </button>

    <p id="nicknameMessage"></p>

</div>


<!-- ================================= -->
<!-- CHAT -->
<!-- ================================= -->

<div class="box" id="chat">

    <h1>💬 Můj chat</h1>

    <p>
        Přihlášen jako:
        <strong id="currentNickname"></strong>
    </p>

    <div id="messages">
        Načítám zprávy...
    </div>

    <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="Napiš zprávu..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
        Odeslat
    </button>

    <button
        class="logout"
        onclick="logout()"
    >
        Odhlásit
    </button>

</div>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://jdvyfigrazambxtnqpkq.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// ZOBRAZENÍ REGISTRACE
// ==========================================

function showRegister() {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "block";

}


// ==========================================
// ZOBRAZENÍ PŘIHLÁŠENÍ
// ==========================================

function showLogin() {

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("nicknameBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "none";

    document.getElementById("loginBox").style.display =
        "block";

}


// ==========================================
// REGISTRACE
// ==========================================

async function register() {

    const email =
        document.getElementById("registerEmail")
            .value
            .trim();

    const password =
        document.getElementById("registerPassword")
            .value;

    const nickname =
        document.getElementById("registerNickname")
            .value
            .trim();

    const message =
        document.getElementById("registerMessage");


    if (!email || !password || !nickname) {

        message.innerText =
            "Vyplň všechna pole.";

        message.className =
            "error";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "Heslo musí mít alespoň 6 znaků.";

        message.className =
            "error";

        return;
    }


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    nickname: nickname
                },

                emailRedirectTo:
                    "https://hanebnybambus.github.io/test/"

            }

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    if (data.session) {

        message.innerText =
            "✅ Účet vytvořen.";

        message.className =
            "success";

        await checkProfile();

        return;
    }


    message.innerText =
        "✅ Účet vytvořen. Zkontroluj e-mail a potvrď registraci.";

    message.className =
        "success";

}


// ==========================================
// PŘIHLÁŠENÍ
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail")
            .value
            .trim();

    const password =
        document.getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "Vyplň e-mail a heslo.";

        message.className =
            "error";

        return;
    }


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    message.innerText =
        "✅ Přihlášení úspěšné.";

    message.className =
        "success";


    await checkProfile();

}


// ==========================================
// KONTROLA PROFILU
// ==========================================

async function checkProfile() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        return;

    }


    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("nickname")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(error);

        alert(
            "Chyba při načítání profilu: " +
            error.message
        );

        return;
    }


    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "none";


    if (profile) {

        openChat(profile.nickname);

        return;

    }


    const savedNickname =
        user.user_metadata?.nickname;


    if (savedNickname) {

        const { data: newProfile, error: insertError } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id: user.id,

                    nickname: savedNickname

                })
                .select("nickname")
                .single();


        if (!insertError && newProfile) {

            openChat(newProfile.nickname);

            return;

        }

    }


    document.getElementById("nicknameBox").style.display =
        "block";

}


// ==========================================
// ULOŽENÍ PŘEZDÍVKY
// ==========================================

async function saveNickname() {

    const nickname =
        document.getElementById("nickname")
            .value
            .trim();

    const message =
        document.getElementById("nicknameMessage");


    if (!nickname) {

        message.innerText =
            "Zadej přezdívku.";

        message.className =
            "error";

        return;
    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;

    }


    const { data, error } =
        await supabaseClient
            .from("profiles")
            .insert({

                id: user.id,

                nickname: nickname

            })
            .select("nickname")
            .single();


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    openChat(data.nickname);

}


// ==========================================
// OTEVŘENÍ CHATU
// ==========================================

async function openChat(nickname) {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("nicknameBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "block";


    document.getElementById("currentNickname").innerText =
        nickname;


    await loadMessages();

}


// ==========================================
// NAČTENÍ ZPRÁV
// ==========================================

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select(
                "id, user_id, nickname, message, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        document.getElementById("messages").innerText =
            "Chyba při načítání zpráv.";

        return;
    }


    const messages =
        document.getElementById("messages");


    messages.innerHTML = "";


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    data.forEach(message => {

        addMessage(
            message,
            user ? user.id : null
        );

    });


    messages.scrollTop =
        messages.scrollHeight;

}


// ==========================================
// ZOBRAZENÍ ZPRÁVY
// ==========================================

function addMessage(message, currentUserId) {

    const messages =
        document.getElementById("messages");


    const div =
        document.createElement("div");


    // Zjistíme, jestli je zpráva moje
    const isMine =
        message.user_id === currentUserId;


    div.className =
        "message " +
        (isMine ? "mine" : "other");


    const nickname =
        document.createElement("span");


    nickname.className =
        "nickname";


    nickname.textContent =
        message.nickname;


    const text =
        document.createElement("span");


    text.textContent =
        message.message;


    const time =
        document.createElement("span");


    time.className =
        "time";


    const date =
        new Date(message.created_at);


    if (!isNaN(date.getTime())) {

        time.textContent =
            date.toLocaleString("cs-CZ", {

                timeZone: "Europe/Prague",

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            });

    } else {

        time.textContent =
            "čas neznámý";

    }


    div.appendChild(nickname);

    div.appendChild(text);

    div.appendChild(time);


    messages.appendChild(div);

}


// ==========================================
// ODESLÁNÍ ZPRÁVY
// ==========================================

async function sendMessage() {

    const input =
        document.getElementById("messageInput");


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;

    }


    const nickname =
        document.getElementById(
            "currentNickname"
        ).innerText;


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({

                user_id: user.id,

                nickname: nickname,

                message: text

            });


    if (error) {

        console.error(error);

        alert(
            "Zprávu se nepodařilo odeslat: " +
            error.message
        );

        return;

    }


    input.value = "";


    await loadMessages();

}


// ==========================================
// AUTOMATICKÉ NAČÍTÁNÍ ZPRÁV
// ==========================================

setInterval(() => {

    const chat =
        document.getElementById("chat");


    if (chat.style.display === "block") {

        loadMessages();

    }

}, 2000);


// ==========================================
// ODHLÁŠENÍ
// ==========================================

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


// ==========================================
// KONTROLA EXISTUJÍCÍHO PŘIHLÁŠENÍ
// ==========================================

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        await checkProfile();

    }

}


checkSession();


</script>

</body>
</html>
