<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .secondary {
            background: #777;
        }

        .logout {
            background: #b00020;
        }

        #registerBox,
        #chat {
            display: none;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fafafa;
        }

        .message {
            padding: 10px;
            margin-bottom: 8px;
            background: #eee;
            border-radius: 8px;
        }

        .nickname {
            font-weight: bold;
        }

        .time {
            color: #777;
            font-size: 12px;
            margin-left: 5px;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: green;
        }

    </style>
</head>

<body>


<!-- =============================== -->
<!-- PŘIHLÁŠENÍ -->
<!-- =============================== -->

<div class="box" id="loginBox">

    <h1>🔐 Přihlášení</h1>

    <input
        type="email"
        id="loginEmail"
        placeholder="E-mail"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Heslo"
    >

    <button onclick="login()">
        Přihlásit
    </button>

    <button
        class="secondary"
        onclick="showRegister()"
    >
        Vytvořit účet
    </button>

    <p id="loginMessage"></p>

</div>


<!-- =============================== -->
<!-- REGISTRACE -->
<!-- =============================== -->

<div class="box" id="registerBox">

    <h1>👤 Nový účet</h1>

    <input
        type="email"
        id="registerEmail"
        placeholder="E-mail"
    >

    <input
        type="password"
        id="registerPassword"
        placeholder="Heslo"
    >

    <input
        type="text"
        id="registerNickname"
        maxlength="30"
        placeholder="Přezdívka"
    >

    <button onclick="register()">
        Registrovat
    </button>

    <button
        class="secondary"
        onclick="showLogin()"
    >
        Zpět na přihlášení
    </button>

    <p id="registerMessage"></p>

</div>


<!-- =============================== -->
<!-- CHAT -->
<!-- =============================== -->

<div class="box" id="chat">

    <h1>💬 Můj chat</h1>

    <p>
        Přihlášen jako:
        <strong id="currentNickname"></strong>
    </p>

    <div id="messages">
        Načítám zprávy...
    </div>

    <input
        type="text"
        id="messageInput"
        maxlength="500"
        placeholder="Napiš zprávu..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">
        Odeslat
    </button>

    <button
        class="logout"
        onclick="logout()"
    >
        Odhlásit
    </button>

</div>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://jdvyfigrazambxtnqpkq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// PŘIHLÁŠENÍ
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        document.getElementById("loginMessage").innerText =
            "❌ " + error.message;

        document.getElementById("loginMessage").className =
            "error";

        return;
    }


    await showChat();
}


// ==========================================
// REGISTRACE
// ==========================================

async function register() {

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const nickname =
        document.getElementById("registerNickname").value.trim();

    const message =
        document.getElementById("registerMessage");


    if (!email || !password || !nickname) {

        message.innerText =
            "Vyplň všechna pole.";

        message.className = "error";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "Heslo musí mít alespoň 6 znaků.";

        message.className = "error";

        return;
    }


    // Vytvoření účtu
    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                emailRedirectTo:
                    "https://hanebnybambus.github.io/test/"

            }

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className = "error";

        return;
    }


    // Uložíme přezdívku do metadata účtu.
    // Profil vytvoříme až po skutečném přihlášení.

    if (data.user) {

        await supabaseClient.auth.updateUser({

            data: {
                nickname: nickname
            }

        });

    }


    message.innerText =
        "✅ Účet byl vytvořen. Zkontroluj svůj e-mail a klikni na potvrzovací odkaz.";

    message.className = "success";

}

// ==========================================
// ZOBRAZENÍ CHATE
// ==========================================

async function showChat() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        showLogin();

        return;
    }


    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("nickname")
            .eq("id", user.id)
            .single();


    if (error) {

        alert(
            "Nepodařilo se načíst profil: " +
            error.message
        );

        return;
    }


    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "block";


    document.getElementById("currentNickname").innerText =
        profile.nickname;


    await loadMessages();
}


// ==========================================
// NAČTENÍ ZPRÁV
// ==========================================

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select(
                "id, nickname, message, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        document.getElementById("messages").innerText =
            "Chyba při načítání zpráv.";

        return;
    }


    const messages =
        document.getElementById("messages");


    messages.innerHTML = "";


    data.forEach(message => {

        addMessage(message);

    });
}


// ==========================================
// ZOBRAZENÍ ZPRÁVY
// ==========================================

function addMessage(message) {

    const messages =
        document.getElementById("messages");


    const div =
        document.createElement("div");


    div.className =
        "message";


    const nickname =
        document.createElement("strong");


    nickname.className =
        "nickname";


    nickname.textContent =
        message.nickname + ":";


    const text =
        document.createElement("span");


    text.textContent =
        " " + message.message;


    const time =
        document.createElement("span");


    time.className =
        "time";


    time.textContent =
        new Date(
            message.created_at
        ).toLocaleTimeString(
            "cs-CZ",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    div.appendChild(nickname);

    div.appendChild(text);

    div.appendChild(time);


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;
}


// ==========================================
// ODESLÁNÍ ZPRÁVY
// ==========================================

async function sendMessage() {

    const input =
        document.getElementById("messageInput");


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;
    }


    const nickname =
        document.getElementById(
            "currentNickname"
        ).innerText;


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({
                user_id: user.id,
                nickname: nickname,
                message: text
            });


    if (error) {

        console.error(error);

        alert(
            "Zprávu se nepodařilo odeslat: " +
            error.message
        );

        return;
    }


    input.value = "";

    await loadMessages();
}


// ==========================================
// ODHLÁŠENÍ
// ==========================================

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("chat").style.display =
        "none";

    showLogin();
}


// ==========================================
// PŘEPÍNÁNÍ OBRAZOVEK
// ==========================================

function showRegister() {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "block";
}


function showLogin() {

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "none";

    document.getElementById("loginBox").style.display =
        "block";
}


// ==========================================
// AUTOMATICKÉ NAČÍTÁNÍ NOVÝCH ZPRÁV
// ==========================================

setInterval(() => {

    const chat =
        document.getElementById("chat");


    if (chat.style.display !== "none") {

        loadMessages();

    }

}, 2000);


// ==========================================
// KONTROLA EXISTUJÍCÍHO PŘIHLÁŠENÍ
// ==========================================

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        await showChat();

    }

}


checkSession();

</script>

</body>
</html>
