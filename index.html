<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Můj chat</h1>

    <input id="loginEmail" type="email" placeholder="E-mail">

    <input id="loginPassword" type="password" placeholder="Heslo">

    <button onclick="login()">Přihlásit</button>

    <p id="message"></p>


<script>

const SUPABASE_URL =
    "https://jdvyfigrazambxtnqpkq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        document.getElementById("message").innerText =
            "Vyplň e-mail a heslo.";

        return;
    }


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "❌ " + error.message;

        return;
    }


    document.getElementById("message").innerText =
        "✅ Přihlášení funguje!";

    console.log("Přihlášený uživatel:", data.user);

}

</script>

</body>
</html>
