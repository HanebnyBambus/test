<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj chat</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS PROMĚNNÉ PRO SNADNÉ PŘEPÍNÁNÍ */
        :root {
            --bg-color: #f2f2f2;
            --box-bg: white;
            --text-color: #333;
            --input-bg: white;
            --border-color: #ddd;
            --msg-other-bg: #e8e8e8;
            --msg-mine-bg: #222;
            --msg-mine-text: white;
        }

        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --border-color: #444;
            --msg-other-bg: #333;
            --msg-mine-bg: #007bff;
            --msg-mine-text: white;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .box {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: var(--box-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        #theme-toggle {
            float: right;
            cursor: pointer;
            padding: 8px 12px;
            background: #555;
            color: white;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }

        input {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover { background: #444; }

        .secondary { background: #777; }
        .logout { background: #b00020; }

        .show-password-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        #registerBox, #nicknameBox, #chatPasswordBox, #chat { display: none; }

        .chatLayout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
        #usersBox { padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-bg); height: 455px; overflow-y: auto; }
        
        .userItem { display: flex; align-items: center; padding: 9px 10px; background: var(--box-bg); border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 7px; }
        .userNickname { font-weight: bold; }

        #messages { height: 400px; overflow-y: auto; border: 1px solid var(--border-color); padding: 12px; margin-top: 15px; border-radius: 10px; background: var(--input-bg); }

        .message { width: fit-content; max-width: 75%; padding: 10px 14px; margin-bottom: 10px; border-radius: 14px; clear: both; word-wrap: break-word; }
        .message.other { margin-right: auto; background: var(--msg-other-bg); color: var(--text-color); }
        .message.mine { margin-left: auto; background: var(--msg-mine-bg); color: var(--msg-mine-text); }
        .nickname { display: block; font-weight: bold; margin-bottom: 4px; }
        .time { display: block; font-size: 11px; margin-top: 6px; color: #777; }
        
        .error { color: #b00020; }
        .success { color: green; }

        @media (max-width: 700px) {
            .chatLayout { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="box" id="loginBox">
    <button id="theme-toggle" onclick="toggleDarkMode()">Tmavý režim</button>
    <h1>🔐 Přihlášení</h1>
    <input id="loginEmail" type="email" placeholder="E-mail">
    <input id="loginPassword" type="password" placeholder="Heslo">
    <label class="show-password-label">
        <input type="checkbox" onchange="document.getElementById('loginPassword').type = this.checked ? 'text' : 'password'"> Zobrazit heslo
    </label>
    <button onclick="login()">Přihlásit</button>
    <button class="secondary" onclick="showRegister()">Vytvořit nový účet</button>
    <p id="loginMessage"></p>
</div>

<!-- ... OSTATNÍ BOXY ZŮSTÁVAJÍ STEJNÉ, POUZE DO NICH PŘIDEJ TLAČÍTKO PRO DARK MODE ... -->
<!-- (Pro zjednodušení kódu zde uvádím zbytek logiky) -->

<div class="box" id="chat">
    <button id="theme-toggle-chat" onclick="toggleDarkMode()" style="width: auto; padding: 5px 10px; font-size: 12px;">Přepnout režim</button>
    <h1>💬 Můj chat</h1>
    <p>Přihlášen jako: <strong id="currentNickname"></strong></p>
    <div class="chatLayout">
        <div id="usersBox">
            <div id="usersTitle">👥 Uživatelé</div>
            <div id="usersList">Načítám uživatele...</div>
        </div>
        <div class="chatMain">
            <div id="messages">Načítám zprávy...</div>
            <input id="messageInput" type="text" maxlength="500" placeholder="Napiš zprávu..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Odeslat</button>
            <button class="logout" onclick="logout()">Odhlásit</button>
        </div>
    </div>
</div>

<script>
// --- LOGIKA PRO DARK MODE ---
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
}

// Při načtení zjistí, zda uživatel měl zapnuto
if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
}

// ... (Zbytek tvého JS kódu zůstává stejný) ...
// (Nezapomeň zkopírovat zbytek funkcí ze svého předchozího souboru!)
</script>
</body>
</html>
