<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .logout {
            background: #b00020;
        }

        #chat {
            display: none;
        }

        #nicknameBox {
            display: none;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            background: #fafafa;
        }

        .message {
            background: #e8e8e8;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .nickname {
            font-weight: bold;
        }

        .time {
            color: #777;
            font-size: 12px;
            margin-left: 6px;
        }

        .error {
            color: #b00020;
        }

    </style>
</head>

<body>


<!-- ================================= -->
<!-- PŘIHLÁŠENÍ -->
<!-- ================================= -->

<div class="box" id="loginBox">

    <h1>🔐 Přihlášení</h1>

    <input
        id="loginEmail"
        type="email"
        placeholder="E-mail"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Heslo"
    >

    <button onclick="login()">
        Přihlásit
    </button>

    <p id="loginMessage"></p>

</div>


<!-- ================================= -->
<!-- PŘEZDÍVKA -->
<!-- ================================= -->

<div class="box" id="nicknameBox">

    <h1>👤 Přezdívka</h1>

    <input
        id="nickname"
        type="text"
        maxlength="30"
        placeholder="Zadej přezdívku"
    >

    <button onclick="saveNickname()">
        Uložit přezdívku
    </button>

    <p id="nicknameMessage"></p>

</div>


<!-- ================================= -->
<!-- CHAT -->
<!-- ================================= -->

<div class="box" id="chat">

    <h1>💬 Můj chat</h1>

    <p>
        Přihlášen jako:
        <strong id="currentNickname"></strong>
    </p>


    <div id="messages">
        Načítám zprávy...
    </div>


    <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="Napiš zprávu..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >


    <button onclick="sendMessage()">
        Odeslat
    </button>


    <button
        class="logout"
        onclick="logout()"
    >
        Odhlásit
    </button>

</div>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://jdvyfigrazambxtnqpkq.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// PŘIHLÁŠENÍ
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        document.getElementById("loginMessage").innerText =
            "❌ " + error.message;

        return;
    }


    await checkProfile();

}


// ==========================================
// KONTROLA PROFILU
// ==========================================

async function checkProfile() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        return;

    }


    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("nickname")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(error);

        alert(
            "Chyba profilu: " +
            error.message
        );

        return;
    }


    document.getElementById("loginBox").style.display =
        "none";


    if (!profile) {

        document.getElementById("nicknameBox").style.display =
            "block";

        return;
    }


    openChat(profile.nickname);

}


// ==========================================
// ULOŽENÍ PŘEZDÍVKY
// ==========================================

async function saveNickname() {

    const nickname =
        document.getElementById("nickname").value.trim();


    if (!nickname) {

        document.getElementById("nicknameMessage").innerText =
            "Zadej přezdívku.";

        return;
    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;
    }


    const { error } =
        await supabaseClient
            .from("profiles")
            .insert({

                id: user.id,

                nickname: nickname

            });


    if (error) {

        console.error(error);

        document.getElementById("nicknameMessage").innerText =
            "❌ " + error.message;

        return;
    }


    openChat(nickname);

}


// ==========================================
// OTEVŘENÍ CHATU
// ==========================================

async function openChat(nickname) {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("nicknameBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "block";


    document.getElementById("currentNickname").innerText =
        nickname;


    await loadMessages();

}


// ==========================================
// NAČTENÍ ZPRÁV
// ==========================================

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select(
                "id, nickname, message, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        document.getElementById("messages").innerText =
            "Chyba při načítání zpráv.";

        return;
    }


    const messages =
        document.getElementById("messages");


    messages.innerHTML = "";


    data.forEach(message => {

        addMessage(message);

    });

}


// ==========================================
// ZOBRAZENÍ ZPRÁVY
// ==========================================

function addMessage(message) {

    const messages =
        document.getElementById("messages");


    const div =
        document.createElement("div");


    div.className =
        "message";


    const nickname =
        document.createElement("span");


    nickname.className =
        "nickname";


    nickname.textContent =
        message.nickname + ":";


    const text =
        document.createElement("span");


    text.textContent =
        " " + message.message;


    const time =
        document.createElement("span");


    time.className =
        "time";


    time.textContent =
        new Date(
            message.created_at
        ).toLocaleTimeString(
            "cs-CZ",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    div.appendChild(nickname);

    div.appendChild(text);

    div.appendChild(time);


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;

}


// ==========================================
// ODESLÁNÍ ZPRÁVY
// ==========================================

async function sendMessage() {

    const input =
        document.getElementById("messageInput");


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;

    }


    const nickname =
        document.getElementById(
            "currentNickname"
        ).innerText;


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({

                user_id: user.id,

                nickname: nickname,

                message: text

            });


    if (error) {

        console.error(error);

        alert(
            "Zprávu se nepodařilo odeslat: " +
            error.message
        );

        return;

    }


    input.value = "";


    await loadMessages();

}


// ==========================================
// AUTOMATICKÉ NAČÍTÁNÍ
// ==========================================

setInterval(() => {

    if (
        document.getElementById("chat").style.display
        !== "none"
    ) {

        loadMessages();

    }

}, 2000);


// ==========================================
// ODHLÁŠENÍ
// ==========================================

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


// ==========================================
// KONTROLA EXISTUJÍCÍ SESSION
// ==========================================

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        await checkProfile();

    }

}


checkSession();


</script>

</body>
</html>
