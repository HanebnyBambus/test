<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Můj chat</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* ================================= */
        /* CSS PROMĚNNÉ PRO TMAVÝ REŽIM */
        /* ================================= */

        :root {
            --bg-color: #f2f2f2;
            --box-bg: #ffffff;
            --text-color: #222222;
            --border-color: #cccccc;
            --box-border: #ddd;
            --sub-bg: #fafafa;
            --msg-other-bg: #e8e8e8;
            --msg-other-text: #222222;
            --msg-mine-bg: #222222;
            --msg-mine-text: #ffffff;
            --time-color: #777777;
            --mine-time-color: #ccc;
            --icon-color: #64748b;
        }

        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444444;
            --box-border: #333333;
            --sub-bg: #262626;
            --msg-other-bg: #333333;
            --msg-other-text: #ffffff;
            --msg-mine-bg: #0066cc;
            --msg-mine-text: #ffffff;
            --time-color: #aaaaaa;
            --mine-time-color: #dddddd;
            --icon-color: #94a3b8;
        }

        * { box-sizing: border-box; }

        input::-ms-reveal, input::-ms-clear { display: none; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .box {
            position: relative;
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: var(--box-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .theme-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: auto;
            padding: 6px 12px;
            margin-top: 0;
            font-size: 14px;
            background: #444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        body.dark-mode .theme-btn { background: #e0e0e0; color: #121212; }

        h1 { text-align: center; }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            color: var(--text-color);
        }

        .password-wrapper { position: relative; width: 100%; margin-top: 10px; }
        .password-wrapper input { margin-top: 0; padding-right: 45px; }

        .toggle-password-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; cursor: pointer; padding: 0; margin-top: 0;
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
            color: var(--icon-color);
        }
        .toggle-password-btn:hover { background: transparent; opacity: 0.8; }
        .toggle-password-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        button { background: #222; color: white; cursor: pointer; border: none; }
        button:hover { background: #444; }
        .secondary { background: #777; }
        .logout { background: #b00020; }

        .chatHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chatHeader p { margin: 0; }
        .logout-small { width: auto; padding: 8px 16px; margin-top: 0; font-size: 14px; }

        #registerBox, #nicknameBox, #chatPasswordBox, #chat { display: none; }

        .chatLayout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
        
        #usersBox { padding: 15px; border: 1px solid var(--box-border); border-radius: 10px; background: var(--sub-bg); height: 520px; overflow-y: auto; }
        #usersTitle { font-weight: bold; font-size: 18px; margin-bottom: 12px; }
        #usersList { display: flex; flex-direction: column; gap: 7px; }
        
        .userItem { display: flex; align-items: center; padding: 9px 10px; background: var(--box-bg); border-radius: 8px; border: 1px solid var(--box-border); }
        .userStatus { margin-right: 8px; font-size: 13px; }
        .userNickname { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .offline { color: #888; }

        .chatMain { min-width: 0; position: relative; }
        
        #messages { height: 420px; overflow-y: auto; border: 1px solid var(--box-border); padding: 12px; border-radius: 10px; background: var(--sub-bg); }
        
        #typingIndicator { height: 20px; font-size: 13px; font-style: italic; color: var(--time-color); margin-top: 5px; padding-left: 5px; }

        .inputGroup { display: flex; gap: 8px; margin-top: 5px; position: relative; }
        .inputGroup input { margin-top: 0; }
        .emoji-btn { width: 45px; margin-top: 0; font-size: 20px; padding: 0; background: var(--sub-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; flex-shrink: 0; }
        .emoji-btn:hover { background: var(--box-border); }
        .inputGroup button.send-btn { width: 120px; margin-top: 0; flex-shrink: 0; }

        #emojiPicker { display: none; position: absolute; bottom: 55px; right: 130px; background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 100; }
        .emoji-item { font-size: 22px; cursor: pointer; text-align: center; user-select: none; padding: 4px; border-radius: 5px; }
        .emoji-item:hover { background: var(--sub-bg); }

        .message { position: relative; width: fit-content; max-width: 75%; padding: 10px 14px; margin-bottom: 10px; border-radius: 14px; clear: both; word-wrap: break-word; }
        .message.other { margin-right: auto; background: var(--msg-other-bg); color: var(--msg-other-text); border-bottom-left-radius: 4px; }
        
        .message.mine { margin-left: auto; background: var(--msg-mine-bg); color: var(--msg-mine-text); border-bottom-right-radius: 4px; padding-right: 50px; }

        .nickname { display: block; font-weight: bold; margin-bottom: 4px; }
        .text { display: block; margin-bottom: 4px; font-size: 15px; }
        .message.mine .nickname { color: #ddd; }
        .message.other .nickname { color: var(--msg-other-text); }
        
        .time { display: block; font-size: 11px; color: var(--time-color); margin-top: 4px;}
        .message.mine .time { color: var(--mine-time-color); }
        
        /* Styl pro text (upraveno) */
        .edited-label { font-style: italic; opacity: 0.8; }

        .message-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 13px; padding: 0; margin: 0; width: auto; opacity: 0.6; }
        .action-btn:hover { opacity: 1; background: transparent; transform: scale(1.1); }
        .edit-btn { color: #ffca28; }
        .delete-btn { color: #ff6b6b; }

        .error { color: #b00020; }
        .success { color: green; }
        .info { color: #555; }

        @media (max-width: 700px) {
            .box { width: 95%; margin: 15px auto; padding: 15px; }
            .chatLayout { grid-template-columns: 1fr; }
            #usersBox { height: auto; max-height: 220px; }
            #messages { height: 380px; }
            .message { max-width: 85%; }
            #emojiPicker { right: 0; left: 0; margin: auto; width: fit-content; }
        }

    </style>
</head>

<body>

<!-- PŘIHLÁŠENÍ -->
<div class="box" id="loginBox">
    <button class="theme-btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <h1>🔐 Přihlášení</h1>
    <input id="loginEmail" type="email" placeholder="E-mail">
    <div class="password-wrapper">
        <input id="loginPassword" type="password" placeholder="Heslo">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>
    <button onclick="login()">Přihlásit</button>
    <button class="secondary" onclick="showRegister()">Vytvořit nový účet</button>
    <p id="loginMessage"></p>
</div>

<!-- REGISTRACE -->
<div class="box" id="registerBox">
    <button class="theme-btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <h1>👤 Registrace</h1>
    <input id="registerEmail" type="email" placeholder="E-mail">
    <div class="password-wrapper">
        <input id="registerPassword" type="password" placeholder="Heslo (min. 6 znaků)">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('registerPassword', this)">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>
    <div class="password-wrapper">
        <input id="registerPasswordConfirm" type="password" placeholder="Potvrď heslo znovu">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('registerPasswordConfirm', this)">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>
    <input id="registerNickname" type="text" maxlength="30" placeholder="Přezdívka">
    <button onclick="register()">Vytvořit účet</button>
    <button class="secondary" onclick="showLogin()">Zpět na přihlášení</button>
    <p id="registerMessage"></p>
</div>

<!-- PŘEZDÍVKA -->
<div class="box" id="nicknameBox">
    <button class="theme-btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <h1>👤 Přezdívka</h1>
    <p>K tomuto účtu zatím nemáš nastavenou přezdívku.</p>
    <input id="nickname" type="text" maxlength="30" placeholder="Zadej přezdívku">
    <button onclick="saveNickname()">Uložit přezdívku</button>
    <p id="nicknameMessage"></p>
</div>

<!-- MÍSTNOST HESLO -->
<div class="box" id="chatPasswordBox">
    <button class="theme-btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <h1>🔒 Tajná místnost</h1>
    <p>Pro vstup do chatu musíš zadat přístupové heslo.</p>
    <div class="password-wrapper">
        <input id="roomPasswordInput" type="password" placeholder="Heslo místnosti" onkeydown="if(event.key === 'Enter') verifyRoomPassword()">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('roomPasswordInput', this)">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>
    <button onclick="verifyRoomPassword()">Vstoupit do chatu</button>
    <button class="logout" onclick="logout()">Zrušit a odhlásit se</button>
    <p id="roomPasswordMessage"></p>
</div>


<!-- CHAT -->
<div class="box" id="chat">
    <button class="theme-btn" onclick="toggleDarkMode()">🌙 / ☀️</button>
    <h1>💬 Můj chat</h1>
    <div class="chatHeader">
        <p>Přihlášen jako: <strong id="currentNickname"></strong></p>
        <button class="logout logout-small" onclick="logout()">Odhlásit</button>
    </div>
    <div class="chatLayout">
        <div id="usersBox">
            <div id="usersTitle">👥 Uživatelé</div>
            <div id="usersList">Načítám uživatele...</div>
        </div>
        <div class="chatMain">
            <div id="messages">Načítám zprávy...</div>
            <div id="typingIndicator"></div>

            <div id="emojiPicker">
                <span class="emoji-item" onclick="insertEmoji('😀')">😀</span>
                <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
                <span class="emoji-item" onclick="insertEmoji('😍')">😍</span>
                <span class="emoji-item" onclick="insertEmoji('👍')">👍</span>
                <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span>
                <span class="emoji-item" onclick="insertEmoji('❤️')">❤️</span>
                <span class="emoji-item" onclick="insertEmoji('🎉')">🎉</span>
                <span class="emoji-item" onclick="insertEmoji('😎')">😎</span>
                <span class="emoji-item" onclick="insertEmoji('🤔')">🤔</span>
                <span class="emoji-item" onclick="insertEmoji('💩')">💩</span>
                <span class="emoji-item" onclick="insertEmoji('🙌')">🙌</span>
                <span class="emoji-item" onclick="insertEmoji('💬')">💬</span>
            </div>

            <div class="inputGroup">
                <button type="button" class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                <input id="messageInput" type="text" maxlength="500" placeholder="Napiš zprávu..." onkeydown="if(event.key === 'Enter') sendMessage()" oninput="handleTyping()">
                <button class="send-btn" onclick="sendMessage()">Odeslat</button>
            </div>
        </div>
    </div>
</div>


<script>

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
    localStorage.setItem("chatDarkMode", document.body.classList.contains("dark-mode"));
}
if (localStorage.getItem("chatDarkMode") === "true") document.body.classList.add("dark-mode");

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const eyeOpen = btn.querySelector('.eye-open');
    const eyeClosed = btn.querySelector('.eye-closed');
    if (input.type === "password") {
        input.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
    } else {
        input.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
    }
}

function toggleEmojiPicker() {
    const picker = document.getElementById("emojiPicker");
    picker.style.display = (picker.style.display === "grid") ? "none" : "grid";
}
function insertEmoji(emoji) {
    const input = document.getElementById("messageInput");
    input.value += emoji;
    input.focus();
    document.getElementById("emojiPicker").style.display = "none";
}

if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
}
function playNotificationSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
}
function triggerNotification(nickname, text) {
    playNotificationSound();
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        new Notification(`Zpráva od ${nickname}`, { body: text });
    }
}


const SUPABASE_URL = "https://jdvyfigrazambxtnqpkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CHAT_PASSWORD = "Krsmol2027"; 

let presenceChannel = null, messagesChannel = null, currentUser = null, currentNickname = null, tempNickname = null;

function showRegister() { document.getElementById("loginBox").style.display = "none"; document.getElementById("registerBox").style.display = "block"; }
function showLogin() {
    ["registerBox", "nicknameBox", "chatPasswordBox", "chat"].forEach(id => document.getElementById(id).style.display = "none");
    document.getElementById("loginBox").style.display = "block";
}
function askForRoomPassword(nickname) {
    tempNickname = nickname;
    ["loginBox", "registerBox", "nicknameBox", "chat"].forEach(id => document.getElementById(id).style.display = "none");
    document.getElementById("chatPasswordBox").style.display = "block";
}
function verifyRoomPassword() {
    const input = document.getElementById("roomPasswordInput").value;
    const msg = document.getElementById("roomPasswordMessage");
    if (input === CHAT_PASSWORD) {
        document.getElementById("chatPasswordBox").style.display = "none";
        openChat(tempNickname);
    } else { msg.innerText = "❌ Nesprávné heslo."; msg.className = "error"; }
}

async function register() {
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const passwordConfirm = document.getElementById("registerPasswordConfirm").value;
    const nickname = document.getElementById("registerNickname").value.trim();
    const message = document.getElementById("registerMessage");

    if (!email || !password || !passwordConfirm || !nickname) return (message.innerText = "Vyplň všechna pole.", message.className = "error");
    if (password !== passwordConfirm) return (message.innerText = "Hesla se neshodují.", message.className = "error");
    if (password.length < 6) return (message.innerText = "Heslo musí mít alespoň 6 znaků.", message.className = "error");

    const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { nickname }, emailRedirectTo: "https://hanebnybambus.github.io/test/" }});
    if (error) return (message.innerText = "❌ " + error.message, message.className = "error");
    if (data.session) { message.innerText = "✅ Účet vytvořen."; message.className = "success"; await checkProfile(); return; }
    message.innerText = "✅ Účet vytvořen. Potvrď e-mail."; message.className = "success";
}

async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");
    if (!email || !password) return (message.innerText = "Vyplň e-mail a heslo.", message.className = "error");

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) return (message.innerText = "❌ " + error.message, message.className = "error");
    await checkProfile();
}

async function checkProfile() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    currentUser = user;
    const { data: profile } = await supabaseClient.from("profiles").select("nickname").eq("id", user.id).maybeSingle();
    
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("registerBox").style.display = "none";

    if (profile) return askForRoomPassword(profile.nickname);
    
    const savedNickname = user.user_metadata?.nickname;
    if (savedNickname) {
        const { data: newProfile } = await supabaseClient.from("profiles").insert({ id: user.id, nickname: savedNickname }).select("nickname").single();
        if (newProfile) return askForRoomPassword(newProfile.nickname);
    }
    document.getElementById("nicknameBox").style.display = "block";
}

async function saveNickname() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) return;
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    const { data, error } = await supabaseClient.from("profiles").insert({ id: user.id, nickname }).select("nickname").single();
    if (!error) askForRoomPassword(data.nickname);
}

async function openChat(nickname) {
    ["loginBox", "registerBox", "nicknameBox", "chatPasswordBox"].forEach(id => document.getElementById(id).style.display = "none");
    document.getElementById("chat").style.display = "block";
    currentNickname = nickname;
    document.getElementById("currentNickname").innerText = nickname;

    await loadMessages();
    await loadUsers();
    await startPresence();
    startMessagesSubscription();
}

async function loadUsers() {
    const { data, error } = await supabaseClient.from("profiles").select("id, nickname").order("nickname", { ascending: true });
    if (!error) renderUsers(data || []);
}

function renderUsers(users) {
    const usersList = document.getElementById("usersList");
    usersList.innerHTML = "";
    if (!users.length) return (usersList.innerText = "Zatím nejsou žádní uživatelé.");
    const onlineUsers = getOnlineUserIds();
    users.forEach(user => {
        const div = document.createElement("div"); div.className = "userItem";
        const status = document.createElement("span"); status.className = "userStatus";
        const nickname = document.createElement("span"); nickname.className = "userNickname"; nickname.textContent = user.nickname;
        if (onlineUsers.has(user.id)) status.textContent = "🟢"; else { status.textContent = "⚪"; nickname.classList.add("offline"); }
        div.appendChild(status); div.appendChild(nickname); usersList.appendChild(div);
    });
}

function getOnlineUserIds() {
    const onlineUsers = new Set();
    if (presenceChannel) {
        Object.values(presenceChannel.presenceState()).forEach(entries => entries.forEach(entry => { if (entry.user_id) onlineUsers.add(entry.user_id); }));
    }
    return onlineUsers;
}

async function startPresence() {
    if (!currentUser || !currentNickname || presenceChannel) return;
    presenceChannel = supabaseClient.channel("chat-online-users", { config: { presence: { key: currentUser.id } } });
    presenceChannel
        .on("presence", { event: "sync" }, () => loadUsers())
        .on("presence", { event: "join" }, () => loadUsers())
        .on("presence", { event: "leave" }, () => loadUsers())
        .on("broadcast", { event: "typing" }, payload => {
            if (payload.payload.user_id !== currentUser.id) {
                const indicator = document.getElementById("typingIndicator");
                indicator.innerText = `${payload.payload.nickname} právě píše...`;
                clearTimeout(window.typingTimeoutTimer);
                window.typingTimeoutTimer = setTimeout(() => { indicator.innerText = ""; }, 2000);
            }
        });
    presenceChannel.subscribe(async status => {
        if (status === "SUBSCRIBED") {
            await presenceChannel.track({ user_id: currentUser.id, nickname: currentNickname, online_at: new Date().toISOString() });
            loadUsers();
        }
    });
}

function handleTyping() {
    if (presenceChannel) presenceChannel.send({ type: "broadcast", event: "typing", payload: { user_id: currentUser.id, nickname: currentNickname } });
}

function startMessagesSubscription() {
    if (messagesChannel) return;
    messagesChannel = supabaseClient.channel("realtime-messages-channel")
        .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, payload => {
            if (payload.eventType === "INSERT") {
                addMessage(payload.new, currentUser ? currentUser.id : null);
                if (currentUser && payload.new.user_id !== currentUser.id) triggerNotification(payload.new.nickname, payload.new.message);
                const msgs = document.getElementById("messages"); if (msgs) msgs.scrollTop = msgs.scrollHeight;
            } 
            else if (payload.eventType === "DELETE") {
                const msgDiv = document.getElementById(`msg-${payload.old.id}`);
                if (msgDiv) msgDiv.remove();
            }
            else if (payload.eventType === "UPDATE") {
                const msgDiv = document.getElementById(`msg-${payload.new.id}`);
                if (msgDiv) {
                    const textSpan = msgDiv.querySelector('.text');
                    if (textSpan) textSpan.textContent = payload.new.message;
                    
                    const timeSpan = msgDiv.querySelector('.time');
                    if (timeSpan && payload.new.is_edited && !timeSpan.innerHTML.includes("(upraveno)")) {
                        timeSpan.innerHTML += ' <span class="edited-label">(upraveno)</span>';
                    }

                    const editBtn = msgDiv.querySelector('.edit-btn');
                    if (editBtn) editBtn.onclick = () => editMessage(payload.new.id, payload.new.message);
                }
            }
        }).subscribe();
}

async function loadMessages() {
    // Nově vybíráme i is_edited
    const { data, error } = await supabaseClient.from("messages").select("id, user_id, nickname, message, created_at, is_edited").order("created_at", { ascending: true });
    const messages = document.getElementById("messages"); messages.innerHTML = "";
    if (data) data.forEach(msg => addMessage(msg, currentUser ? currentUser.id : null));
    messages.scrollTop = messages.scrollHeight;
}

function addMessage(message, currentUserId) {
    if (document.getElementById(`msg-${message.id}`)) return;
    const isMine = message.user_id === currentUserId;

    const div = document.createElement("div");
    div.id = `msg-${message.id}`;
    div.className = "message " + (isMine ? "mine" : "other");

    const nickname = document.createElement("span"); nickname.className = "nickname"; nickname.textContent = message.nickname;
    const text = document.createElement("span"); text.className = "text"; text.textContent = message.message;
    const time = document.createElement("span"); time.className = "time";
    
    const date = new Date(message.created_at);
    time.textContent = !isNaN(date.getTime()) ? date.toLocaleString("cs-CZ", { timeZone: "Europe/Prague", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "čas neznámý";

    // Zobrazení (upraveno)
    if (message.is_edited) {
        time.innerHTML += ' <span class="edited-label">(upraveno)</span>';
    }

    div.appendChild(nickname); div.appendChild(text); div.appendChild(time);

    // Ikony UPRAVIT a SMAZAT
    if (isMine) {
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "message-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "action-btn edit-btn";
        editBtn.innerHTML = "✏️";
        editBtn.title = "Upravit zprávu";
        editBtn.onclick = () => editMessage(message.id, message.message);

        const delBtn = document.createElement("button");
        delBtn.className = "action-btn delete-btn";
        delBtn.innerHTML = "🗑️";
        delBtn.title = "Smazat zprávu";
        delBtn.onclick = () => deleteMessage(message.id);

        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(delBtn);
        div.appendChild(actionsDiv);
    }

    document.getElementById("messages").appendChild(div);
}

// Funkce pro UPRAVENÍ zprávy
async function editMessage(messageId, oldText) {
    const newText = prompt("Uprav svou zprávu:", oldText);
    
    if (newText !== null && newText.trim() !== "" && newText !== oldText) {
        // Posíláme info is_edited: true
        const { error } = await supabaseClient
            .from("messages")
            .update({ message: newText.trim(), is_edited: true })
            .eq("id", messageId);

        if (error) alert("Chyba při úpravě zprávy: " + error.message);
    }
}

// Funkce pro SMAZÁNÍ zprávy
async function deleteMessage(messageId) {
    if (!confirm("Opravdu chceš tuto zprávu smazat?")) return;

    const { error } = await supabaseClient
        .from("messages")
        .delete()
        .eq("id", messageId);

    if (error) alert("Chyba při mazání zprávy: " + error.message);
}

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text) return;

    if (!currentUser) return alert("Nejsi přihlášen.");
    const nickname = document.getElementById("currentNickname").innerText;

    const { error } = await supabaseClient.from("messages").insert({ user_id: currentUser.id, nickname, message: text });
    if (error) return alert("Zprávu se nepodařilo odeslat: " + error.message);
    input.value = "";
}

async function logout() {
    if (presenceChannel) { try { await presenceChannel.untrack(); await supabaseClient.removeChannel(presenceChannel); } catch(e){} }
    if (messagesChannel) { try { await supabaseClient.removeChannel(messagesChannel); } catch(e){} }
    await supabaseClient.auth.signOut();
    location.reload();
}

async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { currentUser = session.user; await checkProfile(); }
}
checkSession();
