<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://jdvyfigrazambxtnqpkq.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YKO_HGnM6so7hNtg_naIeQ_cYX40nxJ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// PROMENNÉ PRO ONLINE STAV A REALTIME ZPRÁVY
// ==========================================

let presenceChannel = null;

let messagesChannel = null;

let currentUser = null;

let currentNickname = null;


// ==========================================
// ZOBRAZENÍ REGISTRACE
// ==========================================

function showRegister() {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "block";

}


// ==========================================
// ZOBRAZENÍ PŘIHLÁŠENÍ
// ==========================================

function showLogin() {

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("nicknameBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "none";

    document.getElementById("loginBox").style.display =
        "block";

}


// ==========================================
// REGISTRACE
// ==========================================

async function register() {

    const email =
        document.getElementById("registerEmail")
            .value
            .trim();

    const password =
        document.getElementById("registerPassword")
            .value;

    const nickname =
        document.getElementById("registerNickname")
            .value
            .trim();

    const message =
        document.getElementById("registerMessage");


    if (!email || !password || !nickname) {

        message.innerText =
            "Vyplň všechna pole.";

        message.className =
            "error";

        return;
    }


    if (password.length < 6) {

        message.innerText =
            "Heslo musí mít alespoň 6 znaků.";

        message.className =
            "error";

        return;
    }


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    nickname: nickname
                },

                emailRedirectTo:
                    "https://hanebnybambus.github.io/test/"

            }

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    if (data.session) {

        message.innerText =
            "✅ Účet vytvořen.";

        message.className =
            "success";

        await checkProfile();

        return;
    }


    message.innerText =
        "✅ Účet vytvořen. Zkontroluj e-mail a potvrď registraci.";

    message.className =
        "success";

}


// ==========================================
// PŘIHLÁŠENÍ
// ==========================================

async function login() {

    const email =
        document.getElementById("loginEmail")
            .value
            .trim();

    const password =
        document.getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.innerText =
            "Vyplň e-mail a heslo.";

        message.className =
            "error";

        return;
    }


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    message.innerText =
        "✅ Přihlášení úspěšné.";

    message.className =
        "success";


    await checkProfile();

}


// ==========================================
// KONTROLA PROFILU
// ==========================================

async function checkProfile() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        return;

    }


    currentUser = user;


    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("nickname")
            .eq("id", user.id)
            .maybeSingle();


    if (error) {

        console.error(error);

        alert(
            "Chyba při načítání profilu: " +
            error.message
        );

        return;
    }


    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "none";


    if (profile) {

        openChat(profile.nickname);

        return;

    }


    const savedNickname =
        user.user_metadata?.nickname;


    if (savedNickname) {

        const { data: newProfile, error: insertError } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id: user.id,

                    nickname: savedNickname

                })
                .select("nickname")
                .single();


        if (!insertError && newProfile) {

            openChat(newProfile.nickname);

            return;

        }

    }


    document.getElementById("nicknameBox").style.display =
        "block";

}


// ==========================================
// ULOŽENÍ PŘEZDÍVKY
// ==========================================

async function saveNickname() {

    const nickname =
        document.getElementById("nickname")
            .value
            .trim();

    const message =
        document.getElementById("nicknameMessage");


    if (!nickname) {

        message.innerText =
            "Zadej přezdívku.";

        message.className =
            "error";

        return;
    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;

    }


    const { data, error } =
        await supabaseClient
            .from("profiles")
            .insert({

                id: user.id,

                nickname: nickname

            })
            .select("nickname")
            .single();


    if (error) {

        console.error(error);

        message.innerText =
            "❌ " + error.message;

        message.className =
            "error";

        return;
    }


    openChat(data.nickname);

}


// ==========================================
// OTEVŘENÍ CHATU
// ==========================================

async function openChat(nickname) {

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("registerBox").style.display =
        "none";

    document.getElementById("nicknameBox").style.display =
        "none";

    document.getElementById("chat").style.display =
        "block";


    currentNickname =
        nickname;


    document.getElementById("currentNickname").innerText =
        nickname;


    await loadMessages();

    await loadUsers();

    await startPresence();

    startMessagesSubscription();

}


// ==========================================
// NAČTENÍ UŽIVATELŮ
// ==========================================

async function loadUsers() {

    const usersList =
        document.getElementById("usersList");


    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("id, nickname")
            .order("nickname", {
                ascending: true
            });


    if (error) {

        console.error(error);

        usersList.innerText =
            "Chyba při načítání uživatelů.";

        return;
    }


    renderUsers(data || []);

}


// ==========================================
// ZOBRAZENÍ UŽIVATELŮ
// ==========================================

function renderUsers(users) {

    const usersList =
        document.getElementById("usersList");


    usersList.innerHTML = "";


    if (!users.length) {

        usersList.innerText =
            "Zatím nejsou žádní uživatelé.";

        return;
    }


    const onlineUsers =
        getOnlineUserIds();


    users.forEach(user => {

        const div =
            document.createElement("div");


        div.className =
            "userItem";


        const status =
            document.createElement("span");


        status.className =
            "userStatus";


        const nickname =
            document.createElement("span");


        nickname.className =
            "userNickname";


        nickname.textContent =
            user.nickname;


        if (onlineUsers.has(user.id)) {

            status.textContent =
                "🟢";

        } else {

            status.textContent =
                "⚪";

            nickname.classList.add("offline");

        }


        div.appendChild(status);

        div.appendChild(nickname);


        usersList.appendChild(div);

    });

}


// ==========================================
// ZÍSKÁNÍ ONLINE UŽIVATELŮ
// ==========================================

function getOnlineUserIds() {

    const onlineUsers =
        new Set();


    if (!presenceChannel) {

        return onlineUsers;

    }


    const state =
        presenceChannel.presenceState();


    Object.values(state).forEach(entries => {

        entries.forEach(entry => {

            if (entry.user_id) {

                onlineUsers.add(
                    entry.user_id
                );

            }

        });

    });


    return onlineUsers;

}


// ==========================================
// SPUŠTĚNÍ ONLINE STAVU
// ==========================================

async function startPresence() {

    if (!currentUser || !currentNickname) {

        return;

    }


    if (presenceChannel) {

        return;

    }


    presenceChannel =
        supabaseClient.channel(
            "chat-online-users",
            {
                config: {
                    presence: {
                        key: currentUser.id
                    }
                }
            }
        );


    presenceChannel
        .on(
            "presence",
            {
                event: "sync"
            },
            () => {

                loadUsers();

            }
        )
        .on(
            "presence",
            {
                event: "join"
            },
            () => {

                loadUsers();

            }
        )
        .on(
            "presence",
            {
                event: "leave"
            },
            () => {

                loadUsers();

            }
        );


    presenceChannel.subscribe(
        async status => {

            if (status !== "SUBSCRIBED") {

                return;

            }


            await presenceChannel.track({

                user_id:
                    currentUser.id,

                nickname:
                    currentNickname,

                online_at:
                    new Date().toISOString()

            });


            loadUsers();

        }
    );

}


// ==========================================
// REALTIME ODBĚR NOVÝCH ZPRÁV
// ==========================================

function startMessagesSubscription() {

    if (messagesChannel) {

        return;

    }


    messagesChannel =
        supabaseClient
            .channel("public:messages")
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                payload => {

                    const newMessage =
                        payload.new;


                    addMessage(
                        newMessage,
                        currentUser ? currentUser.id : null
                    );


                    const messages =
                        document.getElementById("messages");


                    messages.scrollTop =
                        messages.scrollHeight;

                }
            )
            .subscribe();

}


// ==========================================
// NAČTENÍ ZPRÁV
// ==========================================

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select(
                "id, user_id, nickname, message, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        document.getElementById("messages").innerText =
            "Chyba při načítání zpráv.";

        return;
    }


    const messages =
        document.getElementById("messages");


    messages.innerHTML = "";


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    data.forEach(message => {

        addMessage(
            message,
            user ? user.id : null
        );

    });


    messages.scrollTop =
        messages.scrollHeight;

}


// ==========================================
// ZOBRAZENÍ ZPRÁVY
// ==========================================

function addMessage(message, currentUserId) {

    const messages =
        document.getElementById("messages");


    const div =
        document.createElement("div");


    const isMine =
        message.user_id === currentUserId;


    div.className =
        "message " +
        (isMine ? "mine" : "other");


    const nickname =
        document.createElement("span");


    nickname.className =
        "nickname";


    nickname.textContent =
        message.nickname;


    const text =
        document.createElement("span");


    text.textContent =
        message.message;


    const time =
        document.createElement("span");


    time.className =
        "time";


    const date =
        new Date(message.created_at);


    if (!isNaN(date.getTime())) {

        time.textContent =
            date.toLocaleString("cs-CZ", {

                timeZone: "Europe/Prague",

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            });

    } else {

        time.textContent =
            "čas neznámý";

    }


    div.appendChild(nickname);

    div.appendChild(text);

    div.appendChild(time);


    messages.appendChild(div);

}


// ==========================================
// ODESLÁNÍ ZPRÁVY
// ==========================================

async function sendMessage() {

    const input =
        document.getElementById("messageInput");


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        alert("Nejsi přihlášen.");

        return;

    }


    const nickname =
        document.getElementById(
            "currentNickname"
        ).innerText;


    const { error } =
        await supabaseClient
            .from("messages")
            .insert({

                user_id: user.id,

                nickname: nickname,

                message: text

            });


    if (error) {

        console.error(error);

        alert(
            "Zprávu se nepodařilo odeslat: " +
            error.message
        );

        return;

    }


    input.value = "";

}


// ==========================================
// ODHLÁŠENÍ
// ==========================================

async function logout() {

    if (presenceChannel) {

        try {

            await presenceChannel.untrack();

        } catch (error) {

            console.error(error);

        }


        await supabaseClient.removeChannel(
            presenceChannel
        );


        presenceChannel =
            null;

    }


    if (messagesChannel) {

        await supabaseClient.removeChannel(
            messagesChannel
        );


        messagesChannel =
            null;

    }


    await supabaseClient.auth.signOut();

    location.reload();

}


// ==========================================
// KONTROLA EXISTUJÍCÍHO PŘIHLÁŠENÍ
// ==========================================

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        currentUser =
            session.user;

        await checkProfile();

    }

}


checkSession();


</script>
